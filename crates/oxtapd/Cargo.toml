[workspace]

[package]
name = "oxtapd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Tae Goo Kang <kodeholic99@gmail.com>"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxtapd"
path = "src/main.rs"

[dependencies]
oxsig = { path = "../oxsig" }
common = { path = "../common" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tonic = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
oxpeer = { path = "../oxpeer", features = ["record"] }

[dev-dependencies]
oxmesh = { path = "../oxmesh" }
tokio = { version = "1", features = ["full", "test-util"] }
rcgen = "0.13"

[profile.dev]
split-debuginfo = "packed"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

syntax = "proto3";
package oxlens.handle.v1;

service Handle {
  rpc Hello(HelloReq) returns (HelloRes);
  rpc Call(Envelope) returns (Envelope);
}

message HelloReq {
  string node = 1;
  string hub_inst = 2;
}

message HelloRes {
  string epoch = 1;
  string build = 2;
}

message Envelope {
  bytes body = 1;
}

[package]
name = "oxrecd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxrecd"
path = "src/main.rs"

[dependencies]
oxsig = { workspace = true }
common = { workspace = true }
oxmesh = { workspace = true }
serde_json = { workspace = true }

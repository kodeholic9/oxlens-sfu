[workspace]
# ★재작성 중(spec/v1.1) — 덩어리마다 아래층부터 members 를 되돌린다.
#   그래야 `cargo build`(workspace 전량)가 게이트로 살아 있다 — `-p` 스코프는 쓰지 않는다.
#   복구 순서: oxsig → common → oxhubd → oxsfud.
members = ["crates/oxsig", "crates/common", "crates/oxhubd", "crates/oxsfud"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Tae Goo Kang <kodeholic99@gmail.com>"]

[workspace.dependencies]
oxsig = { path = "crates/oxsig" }
common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
jsonwebtoken = "9"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.26", features = ["signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
dashmap = "6"
arc-swap = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
getrandom = { version = "0.3", features = ["std"] }
sha2 = "0.10"
rcgen = "0.13"
dtls = "0.17.1"
webrtc-srtp = "0.17.1"
webrtc-util = "0.17.1"
sctp-proto = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }
# ★★**1.10 이상으로 고정한다**(정§15-0) — 1.10.0 이 *"routers unregistering liveness
#   tokens and queryables"* 를 고쳤고, ★그 자리가 router 가 남의 토큰을 관리하는 자리라
#   이 형상의 핵심 기전이다. 그 아래 판에서는 ★**살아 있는 방이 사라진 것으로 보인다.**
zenoh = "1.10"
bytes = "1"
hmac = "0.12"
sha1 = "0.10"
crc32fast = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace]
members = ["crates/oxsig", "crates/common", "crates/oxhubd", "crates/oxsfud", "crates/oxadmin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Tae Goo Kang <kodeholic99@gmail.com>"]

[workspace.dependencies]
oxsig = { path = "crates/oxsig" }
common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
jsonwebtoken = "9"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.26", features = ["signal", "socket"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
dashmap = "6"
arc-swap = "1"
crossbeam-queue = "0.3"
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = { version = "0.6", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
getrandom = { version = "0.3", features = ["std"] }
sha2 = "0.10"
rcgen = "0.13"
dtls = "0.17.1"
webrtc-srtp = "0.17.1"
webrtc-util = "0.17.1"
sctp-proto = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }
zenoh = { version = "1.10", features = ["unstable"] }
bytes = "1"
hmac = "0.12"
sha1 = "0.10"
crc32fast = "1"
rtcp = "0.17"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"

[profile.dev]
split-debuginfo = "packed"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

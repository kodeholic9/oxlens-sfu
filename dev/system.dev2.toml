# 개발 실증용 — ★**node B**(hub 19746 + sfud 50063). `system.dev.toml` 의 짝이다.
#
# ★★**hub 하나 = node 하나다**(정§15-0) — hub 가 zenoh router 를 임베드하므로,
#   node 를 둘 만들려면 hub 를 둘 띄운다. node 간 축(배치 합의·통지 횡단·세션 귀속·
#   노드 소멸)은 ★**이 파일과 `system.dev2.toml` 둘이 함께 서야** 성립한다.
# ★한 node 안에 sfud 가 여럿인 것은 실형상이다 — 그래서 여기는 둘로 둔다.
#   그래야 「한 node 안 cross-sfu」와 「node 간」이 한 판에서 갈린다.
[hub]
listen = "127.0.0.1:19746"
base_path = "/media"

[hub.auth]
jwt_secret = "change-me-in-production"

[[hub.auth.api_keys]]
key = "ox_k_demo"
secret = "ox_s_demo"
name = "demo"
# 정§3-4·§16-1-1 — 이 계정이 서명할 수 있는 것. 투명·운영은 켜는 것이 명시적 결정이다.
participant_types = [0, 1, 2]
hidden_allowed = true
ops_allowed = true

# 계정마다 낼 수 있는 것이 다르다(정§3-4) — 제한 계정이 있어야 `2005` 갈래가 실증된다.
[[hub.auth.api_keys]]
key = "ox_k_limited"
secret = "ox_s_limited"
name = "limited"
participant_types = [0]
hidden_allowed = false
ops_allowed = false

# ★유닛은 hub 가 띄운다(정§16-1) — 하네스가 sfud 를 직접 띄우지 않는다.
#   그래야 부모 생존 채널이 서고(정§15-6), 기동·정지 순서가 한 곳에서 정해진다.
[[unit]]
id = "node-b"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50063"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50063", "--udp-port", "20002", "--policy", "policy.toml"]

[zenoh]
mode = "router"
listen = ["tcp/127.0.0.1:7448"]
connect = ["tcp/127.0.0.1:7447"]
multicast_scouting = false
qos_enabled = true
lowlatency = false
namespace = "oxdev"

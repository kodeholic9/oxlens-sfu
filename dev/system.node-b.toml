[hub]
listen = "127.0.0.1:1975"
base_path = "/media"
log_dir = "/tmp/oxlens/node-b"
log_socket = "/tmp/oxlens/node-b/log.sock"

[hub.auth]
jwt_secret = "change-me-in-production"

[[hub.auth.api_keys]]
key = "ox_k_demo"
secret = "ox_s_demo"
name = "demo"
participant_types = [0, 1, 2]
hidden_allowed = true
ops_allowed = true
hook_allowed = true

[[hub.auth.api_keys]]
key = "ox_k_limited"
secret = "ox_s_limited"
name = "limited"
participant_types = [0]
hidden_allowed = false
ops_allowed = false
hook_allowed = false

[[hub.auth.api_keys]]
key = "ox_3rd"
secret = "ox_s_3rd"
name = "3rd"
participant_types = [0]
hidden_allowed = false
ops_allowed = false
hook_allowed = true
subscribe = ["", "talk"]

[[unit]]
id = "log-node-b"
kind = "inproc"
order = 1
role = "log"

[[unit]]
id = "node-b"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50062"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50062", "--udp-port", "20001", "--tcp-port", "20001", "--policy", "policy.toml", "--public-ip", "auto"]

[[unit]]
id = "rec-node-b"
kind = "process"
order = 3
role = "rec"
addr = "127.0.0.1:50162"
cmd = ["./target/debug/oxtapd", "--grpc-listen", "127.0.0.1:50162"]

[data]
root = "/tmp/oxlens/data"

[bus]
listen = ["tcp/127.0.0.1:7448"]
connect = ["tcp/127.0.0.1:7447", "tcp/127.0.0.1:7449"]
namespace = "oxdev"

[chat]
db = "sqlite:/tmp/oxlens/chat.db"

[hook]
zenoh_listen = "tls/127.0.0.1:7548"
zenoh_cert = "dev/pki/hub.pem"
zenoh_key = "dev/pki/hub.key"
zenoh_ca = "dev/pki/ca.pem"

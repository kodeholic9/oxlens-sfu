[hub]
listen = "127.0.0.1:1975"
base_path = "/media"
log_dir = "/tmp/oxlens/node-b"
log_socket = "/tmp/oxlens/node-b/log.sock"

[hub.auth]
jwt_secret = "change-me-in-production"

[[hub.auth.api_keys]]
key = "ox_k_demo"
secret = "ox_s_demo"
name = "demo"
participant_types = [0, 1, 2]
hidden_allowed = true
ops_allowed = true
hook_allowed = true

[[hub.auth.api_keys]]
key = "ox_k_limited"
secret = "ox_s_limited"
name = "limited"
participant_types = [0]
hidden_allowed = false
ops_allowed = false
hook_allowed = false

[[unit]]
id = "log-node-b"
kind = "inproc"
order = 1
role = "log"

[[unit]]
id = "node-b"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50062"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50062", "--udp-port", "20001", "--tcp-port", "20001", "--policy", "policy.toml", "--public-ip", "auto"]

[zenoh]
mode = "router"
listen = ["tcp/127.0.0.1:7448"]
connect = ["tcp/127.0.0.1:7447", "tcp/127.0.0.1:7449"]
multicast_scouting = false
qos_enabled = true
lowlatency = false
namespace = "oxdev"

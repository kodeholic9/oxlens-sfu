[hub]
listen = "127.0.0.1:1976"
base_path = "/media"

[hub.auth]
jwt_secret = "change-me-in-production"

[[hub.auth.api_keys]]
key = "ox_k_demo"
secret = "ox_s_demo"
name = "demo"
participant_types = [0, 1, 2]
hidden_allowed = true
ops_allowed = true
hook_allowed = true

[[hub.auth.api_keys]]
key = "ox_k_limited"
secret = "ox_s_limited"
name = "limited"
participant_types = [0]
hidden_allowed = false
ops_allowed = false
hook_allowed = false

[[unit]]
id = "node-c"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50063"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50063", "--udp-port", "20002", "--policy", "policy.toml", "--public-ip", "auto"]

[zenoh]
mode = "router"
listen = ["tcp/127.0.0.1:7449"]
connect = ["tcp/127.0.0.1:7447", "tcp/127.0.0.1:7448"]
multicast_scouting = false
qos_enabled = true
lowlatency = false
namespace = "oxdev"

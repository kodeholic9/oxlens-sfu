# 개발 실증용 시스템 파일 — hub 19745(1974 는 구 서버가 점유) + sfud 둘(gRPC 50061·50062).
# ★노드가 둘이어야 배치(HRW)가 관측 가능하다 — 하나면 "다른 노드" 형상이 성립 불가라 2층이 거짓말을 한다.
# 값의 뜻은 crates/common/src/config.rs.
[hub]
listen = "127.0.0.1:19745"
base_path = "/media"

[hub.auth]
jwt_secret = "change-me-in-production"

[[hub.auth.api_keys]]
key = "ox_k_demo"
secret = "ox_s_demo"
name = "demo"
# 정§3-4·§16-1-1 — 이 계정이 서명할 수 있는 것. 투명·운영은 켜는 것이 명시적 결정이다.
participant_types = [0, 1, 2]
hidden_allowed = true
ops_allowed = true

# 계정마다 낼 수 있는 것이 다르다(정§3-4) — 제한 계정이 있어야 `2005` 갈래가 실증된다.
[[hub.auth.api_keys]]
key = "ox_k_limited"
secret = "ox_s_limited"
name = "limited"
participant_types = [0]
hidden_allowed = false
ops_allowed = false

# ★유닛은 hub 가 띄운다(정§16-1) — 하네스가 sfud 를 직접 띄우지 않는다.
#   그래야 부모 생존 채널이 서고(정§15-6), 기동·정지 순서가 한 곳에서 정해진다.
[[unit]]
id = "sfu-1"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50061"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50061", "--udp-port", "20000"]

[[unit]]
id = "sfu-2"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50062"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50062", "--udp-port", "20001"]

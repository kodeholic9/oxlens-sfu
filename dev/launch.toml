# 개발 실증 형상 — ★2층 하네스(`oxe2epy`)가 이것을 읽어 서버를 띄운다.
#
# ★★**형상은 node 목록이다**(정§15-0 — node 하나 = hub 하나 + sfu 하나).
#   시스템 파일은 ★**생성물**이다(`dev/gen_nodes.py 3`) — 포트 규칙이 거기 한 곳에 있다.
# ★hub listen·유닛 id·gRPC 주소·버스 좌표는 여기 안 적는다. 두 곳에 적으면 갈린다.
nodes = ["node-a", "node-b", "node-c"]
system = "dev/system.{node}.toml"
# ★**시험이 붙는 곳** — 방이 어느 node 에 앉든 클라는 여기로 붙는다(관문, 정§15-1).
#   ★그래서 「붙는 곳」과 「미디어가 도는 곳」이 갈린다 — cross-node 가 그 갈림을 본다.
entry = "node-a"
policy = "policy.toml"
# ICE 후보로 낼 주소. `auto` = 기본 인터페이스 주소(브라우저 3층이 다른 기기에서 붙는다).
public_ip = "auto"

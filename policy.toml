# oxlens-sfu 정책 파일 — 정책서 oxlens_policy.md §3 키 전량. 모르는 키는 기동 실패.
[logging]
level = "info"

[media]
bwe_mode = "twcc"
# ★이 파일은 개발 실증용이다(dev/system.dev.toml 과 짝). 상용 기본은 `off`(명시 opt-in — 정책서 §3)이고
# 그 값은 crates/common/src/config.rs 의 default 가 갖는다. 여기서 v2 를 켜는 이유는 2층 sim_bwe 축이
# 그것을 전제하기 때문이다 — 끄면 그 세 시나리오가 「선언한 축의 자료 0」으로 정직하게 빨개진다.
auto_layer = "v2"

[floor]
queue_max = 10
t2_stop_talking_secs = 30

[hub]
token_ttl_secs = 3600
# 연§4-4 — 토큰 metadata 직렬화 길이 상한. 0 = 무제한.
metadata_max_bytes = 2048
heartbeat_interval_ms = 10000
heartbeat_timeout_ms = 30000
resume_window_ms = 60000
ws_flow_window = 8
room_default_capacity = 1000
# 연§5-1 — 브라우저 클라의 origin 허용. 빈 목록이면 같은 origin 배포 전제.
allowed_origins = ["*"]

[quota]
max_sessions_per_account = 0
max_rooms_per_account = 0

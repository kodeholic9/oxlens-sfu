[hub]
listen = "0.0.0.0:1974"
base_path = "/media"

[hub.auth]
jwt_secret = "change-me-in-production"

[[hub.auth.api_keys]]
key = "ox_k_demo"
secret = "ox_s_demo"
name = "demo"
participant_types = [0, 1, 2]
hidden_allowed = true
ops_allowed = true
hook_allowed = false

[[unit]]
id = "node-a"
kind = "process"
order = 1
role = "sfu"
addr = "127.0.0.1:50061"
cmd = ["./target/debug/oxsfud", "--grpc-listen", "127.0.0.1:50061", "--udp-port", "20000", "--policy", "policy.toml", "--public-ip", "auto"]

[zenoh]
mode = "router"
listen = ["tcp/127.0.0.1:7447"]
connect = []
multicast_scouting = false
qos_enabled = true
lowlatency = false
namespace = "ox"

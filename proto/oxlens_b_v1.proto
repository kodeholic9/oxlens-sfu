// author: kodeholic (powered by Claude)
// B 평면 — hub↔sfud (정§15). 메시지 집합의 정식 규격은 예정이고, 이 파일은 envelope 하나와 구독 하나만 든다.
// wire 는 클라 프레임(연§3-1) 그대로 통과한다. user_id 는 hub 세션에서 주입한다(body 를 믿지 않는다).
syntax = "proto3";
package oxlens.b.v1;

service SfuService {
  // 요청 하나 → 응답 wire 하나(성공/실패 프레임). hub 가 재해석하지 않고 클라에 통과시킨다.
  rpc Handle(Envelope) returns (Envelope);
  // sfud → hub 통지 스트림. target 이 있으면 그 사용자에게, 없으면 room_id 방 전원(exclude 제외).
  rpc Subscribe(SubscribeRequest) returns (stream Envelope);
}

message Envelope {
  string session_id = 1;
  string user_id = 2;
  string room_id = 3;
  string target = 4;
  repeated string exclude = 5;
  bytes wire = 6;
  // 세션 확정값(연§6-1) — sfud 가 server_config.pc_mode 로 에코한다. 통지에는 비어 있다.
  string pc_mode = 7;
  // 연§4-4 — 토큰이 준 신원. ★ROOM_JOIN 에만 실린다(정§15-2 — 프로필을 핫패스에 태우지 않는다).
  uint32 participant_type = 8;
  bool hidden = 9;
  // 불투명 JSON 직렬화본. 비어 있으면 없는 것이다.
  string metadata = 10;
}

message SubscribeRequest {
  string hub_id = 1;
}

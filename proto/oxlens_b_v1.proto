// author: kodeholic (powered by Claude)
// spec: v1.1 · 정§15-0 · §15-5 · §16-1 · model: claude-opus-5
//
// B 평면 — ★node **안**은 로컬 gRPC 하나이고 node **사이**는 전부 zenoh 다(정§15-0).
// 이 파일은 그 "안"쪽이다. wire 는 클라 프레임(연§3-1) 그대로 통과한다 —
// hub 가 재해석하지 않는다. ★user_id 는 hub 세션에서 주입한다(body 를 믿지 않는다).
syntax = "proto3";
package oxlens.b.v1;

service SfuService {
  // ★기동 핸드셰이크 — hub 가 유닛을 등록할 때 ★**기동 신원을 받아 든다**(정§16-1).
  //   이것이 답하는 순간이 그 유닛의 `Running` 이고, 그 전은 `Starting` 이다.
  rpc Hello(HelloRequest) returns (HelloReply);
  // 요청 하나 → 응답 wire 하나(성공/실패 프레임). hub 가 재해석하지 않고 클라에 통과시킨다.
  rpc Handle(Envelope) returns (Envelope);
  // ★방 대장 반영 + 그 node 가 쥔 방들의 현황. ★**zenoh `room/{R}` 토큰의 대역**이다 —
  //   node 사이가 열리면 이 RPC 는 토큰 선언/구독으로 갈린다(정§15-2). 그때까지도
  //   ★**권위는 sfud 다** — hub 는 대장(이름·정원·TTL)을 밀고 현황(명단·seq)을 받아 온다.
  rpc Rooms(RoomLedger) returns (RoomView);
  // sfud → hub 통지 스트림. target 이 있으면 그 사용자에게, 없으면 room_id 방 전원(exclude 제외).
  rpc Subscribe(SubscribeRequest) returns (stream Envelope);
}

message HelloRequest {
  // 부르는 hub 의 안정 배치 키(정§15-3).
  string node_id = 1;
}

message HelloReply {
  // ★**기동마다 새 값** — `epoch` = `sfu_id` = §15-1 키의 `{inst}`(정§14-1).
  //   고정 별칭을 쓰면 클라가 `seq` 재시작을 못 가린다.
  string epoch = 1;
  // 이 바이너리가 어느 소스의 산물인가 — ★스스로 말한다.
  string build = 2;
}

message Envelope {
  string session_id = 1;
  string user_id = 2;
  string room_id = 3;
  string target = 4;
  repeated string exclude = 5;
  bytes wire = 6;
  // 세션 확정값(연§6-1) — sfud 가 server_config.pc_mode 로 에코한다. 통지에는 비어 있다.
  string pc_mode = 7;
  // 연§4-4 — 토큰이 준 신원. ★ROOM_JOIN 에만 실린다(프로필을 핫패스에 태우지 않는다).
  uint32 participant_type = 8;
  bool hidden = 9;
  // 불투명 JSON 직렬화본. 비어 있으면 없는 것이다.
  string metadata = 10;
}

message SubscribeRequest {
  string hub_id = 1;
}

// 방 대장 한 줄 — ★**hub 가 만든 것**(연§5-4). 명단·seq 는 여기 없다(sfud 것이다).
message RoomRecord {
  string room_id = 1;
  string name = 2;
  uint32 capacity = 3;
  // ★부재 = 영구. 0 과 다르다(0 은 "즉시").
  optional uint32 unused_ttl_secs = 4;
  optional uint32 departure_ttl_secs = 5;
}

message RoomLedger {
  string node_id = 1;
  repeated RoomRecord put = 2;
  repeated string drop = 3;
}

message RoomView {
  string epoch = 1;
  // 그 node 가 쥔 방들의 현황 — JSON 한 줄씩(연§5-4 목록 항목 형).
  repeated string rooms = 2;
  // ★TTL 로 만료된 방 — hub 는 대장에서 지운다(정§16-1-3). sfud 는 이미 폭파했다.
  repeated string expired = 3;
}
